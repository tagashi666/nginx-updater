name: Shellcheck

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check
        run: bash -n nginx-upgrade.sh

      - name: Shellcheck (warnings and above)
        run: shellcheck -S warning nginx-upgrade.sh

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version/CVE engine unit tests
        run: bash tests/test-engine.sh
