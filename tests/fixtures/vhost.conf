server {
    listen 80;
    listen [::]:80;
    server_name example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.org;
    ssl_certificate /etc/ssl/x.pem;
    location / { proxy_pass http://127.0.0.1:3000; }
}

server {
    listen 8080 http2;
    server_name plain.example.org;
    location / { return 200; }
}
